<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Abrir no Navegador</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      <div class="presell-tt__step">

          Clique no menu <strong>···</strong> no canto superior direito
        </p>
      </div>

      <div class="presell-tt__step">
        <div class="presell-tt__step-icon">📱</div>
        <p class="presell-tt__step-text">
          Selecione <strong>"Abrir no navegador"</strong>
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="presell-tt__footer">
