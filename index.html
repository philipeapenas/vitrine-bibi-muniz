<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bibi Muniz</title>
  <meta name="description" content="Todos os meus links em um só lugar.">
  <link rel="icon" href="assets/photos/profile.jpg">

  <meta property="og:title" content="Bibi Muniz">
  <meta property="og:description" content="Todos os meus links em um só lugar.">
  <meta property="og:image" content="assets/photos/profile.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d0d12;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.10);
      --text: #ffffff;
      --muted: #b8b8c2;
      --accent: #ff3d7f;
      --accent-2: #ff7ab3;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: radial-gradient(1200px 800px at 50% -10%, #2a1230 0%, var(--bg) 55%) no-repeat;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 32px 18px 48px;
    }

    /* Perfil */
    .profile {
      text-align: center;
      margin-bottom: 22px;
    }
    .profile img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 24px rgba(255, 61, 127, 0.35);
    }
    .profile h1 {
      margin: 12px 0 4px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }
    .profile .handle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 10px;
    }
    .profile .bio {
      color: #e6e6ec;
      font-size: 15px;
      line-height: 1.4;
      margin: 0;
      white-space: pre-line;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 22px;
    }
    .link-btn {
      display: block;
      width: 100%;
      padding: 16px 18px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      border-radius: 14px;
      border: 0;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255, 61, 127, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .link-btn:active { transform: scale(0.98); }

    /* Tutorial (ajuda passiva) */
    .tutorial {
      margin-top: 28px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .tutorial h2 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }
    .tutorial p.sub {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .tutorial img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }
    .steps {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .step {
      display: flex;
      gap: 10px;
      font-size: 14px;
      color: #d8d8de;
    }
    .step .num {
      flex: 0 0 22px;
      color: var(--accent-2);
      font-weight: 800;
    }
    .step strong { color: #fff; }

    .foot {
      margin-top: 22px;
      text-align: center;
      color: #6a6a76;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="wrap">

    <section class="profile">
      <img src="assets/photos/profile.jpg" alt="Bibi Muniz">
      <h1>Bibi Muniz</h1>
      <p class="handle">@bibimunizz021</p>
      <p class="bio">Tudo o que você procura 💋</p>
    </section>

    <section class="links" id="links"></section>

    <section class="tutorial">
      <h2>Não está abrindo? 👇</h2>
      <p class="sub">Se o link não abrir, siga 3 passos:</p>
      <img src="assets/photos/tutorial.webp" alt="Tutorial: toque nos três pontinhos e abra no navegador">
      <div class="steps">
        <div class="step"><div class="num">1)</div><div>Toque nos <strong>três pontinhos</strong> (canto superior direito)</div></div>
        <div class="step"><div class="num">2)</div><div>Escolha <strong>"Abrir no navegador"</strong></div></div>
        <div class="step"><div class="num">3)</div><div>Volte aqui e toque no link de novo</div></div>
      </div>
    </section>

  </div>

  <script>
    (function () {
      "use strict";

      const LINKS = [
        { title: "Privacy 🍊",          url: "http://bibimuniz.vercel.app/checkout" },
        { title: "Cantinho secreto 🔞", url: "https://apextry.com/go/bibimunizzofc" }
      ];

      const root = document.getElementById('links');
      LINKS.forEach(function (l) {
        const a = document.createElement('a');
        a.className = 'link-btn';
        a.href = l.url;
        a.rel = 'noopener noreferrer';
        a.textContent = l.title;
        root.appendChild(a);
      });
    })();
  </script>
</body>
</html>
