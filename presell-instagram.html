<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Continuar</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="presell-ig">
    <div class="presell-ig__card">
      <!-- Avatar with Instagram gradient ring -->
      <div class="presell-ig__avatar-wrapper">
        <div class="presell-ig__avatar-ring"></div>
        <img id="presell-avatar" class="presell-ig__avatar" src="" alt="Profile">
      </div>

      <p class="presell-ig__text">
        Click on continue to see<br>
        <strong id="presell-username"></strong>'s page
      </p>
      <button id="presell-btn" class="presell-ig__btn">Continue</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    (function () {
      "use strict";

      const avatar = document.getElementById("presell-avatar");
      const username = document.getElementById("presell-username");
      const btn = document.getElementById("presell-btn");

      // Populate from config
      if (avatar && CONFIG.profilePhoto) {
        avatar.src = CONFIG.profilePhoto;
      }
      if (username && CONFIG.presell && CONFIG.presell.instagram) {
        username.textContent = CONFIG.presell.instagram.username || CONFIG.profileName;
      }

      // Ripple effect on button click
      function createBtnRipple(e) {
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 2;
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;

        const ripple = document.createElement("span");
        ripple.style.cssText = `
          position: absolute;
          width: ${size}px;
          height: ${size}px;
          left: ${x}px;
          top: ${y}px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
          transform: scale(0);
          animation: rippleExpand 0.6s ease-out forwards;
          pointer-events: none;
        `;

        btn.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove());
      }

      // On click → redirect to main page or custom URL
      if (btn) {
        btn.addEventListener("click", function (e) {
          createBtnRipple(e);

          // Small delay to show ripple before redirect
          setTimeout(() => {
            const redirectUrl =
              CONFIG.presell &&
              CONFIG.presell.instagram &&
              CONFIG.presell.instagram.redirectUrl;
            window.location.href = redirectUrl || "index.html?from=presell";
          }, 200);
        });
      }
    })();
  </script>

  <style>
    @keyframes rippleExpand {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>
</body>
</html>
